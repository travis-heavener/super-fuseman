<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
        <meta name="theme-color" content="#111">
        <title>Super Fuseman</title>
        <link rel="icon" href="/res/gfx/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/index.css">
        <script src="/js/index.mjs" type="module"></script>

        <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
        <script defer src="/_vercel/insights/script.js"></script>
    </head>
    <body>
        <!-- Match clock and page-session wins beside or above the playfield -->
        <div id="game-layout">
            <div id="hud">
                <div id="match-clock">
                    <span id="clock-label">TIME</span>
                    <span id="clock-value">00:00</span>
                </div>
                <div id="scores"></div>
            </div>

            <div id="arena">
                <canvas id="game-canvas"></canvas>

                <!-- Brief warning before the arena closes in sudden death -->
                <div id="warning" role="status" aria-live="polite"></div>
            </div>
        </div>

        <!-- Pause & match end text (HTML so it stays crisp when the canvas is scaled up) -->
        <div id="overlay">
            <h1 id="overlay-title"></h1>
            <p id="overlay-subtitle"></p>
        </div>

        <!-- Fullscreen toggle for touch browsers that support it -->
        <button id="fullscreen-button" type="button" aria-label="Enter fullscreen" aria-pressed="false">FULL</button>

        <!-- Touch controls (revealed by script, only displayed on touch devices) -->
        <div id="touch-controls">
            <button id="pause-button" type="button" aria-label="Pause game">Ⅱ</button>
            <div id="dpad">
                <span class="dpad-arm" data-dir="up"></span>
                <span class="dpad-arm" data-dir="down"></span>
                <span class="dpad-arm" data-dir="left"></span>
                <span class="dpad-arm" data-dir="right"></span>
            </div>
            <div id="plant-button">PLANT</div>
        </div>
    </body>
</html>
